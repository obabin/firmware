[env:dual_band_c3_lr1121_rx]
extends = esp32c3_base
board = esp32-c3-devkitm-1
board_build.partitions = variants/esp32c3/diy/dual_band_c3_lr1121_rx/custom_large_fs.csv

build_flags =
  ${esp32c3_base.build_flags}
  -D TARGET_DUAL_BAND_C3_LR1121_RX
  -I variants/esp32c3/diy/dual_band_c3_lr1121_rx
  
  ; --- RadioLib Optimization (Exclude unneeded driver sets) ---
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  
  ; --- Codebase Stripping (Maximize local SPIFFS disk index space) ---
  -D ARCH_HAS_NO_SCREEN=1
  -D DISABLE_GPS=1
  -D DISABLE_TELEMETRY=1
  -D DISABLE_AUDIO=1
  -D DISABLE_INPUTBROKER=1
  -D DISABLE_CANNED_MESSAGES=1
  
  ; --- Network Disables (Preserve pure BLE app integration) ---
  -D DISABLE_WIFI=1
  -D DISABLE_MQTT=1
